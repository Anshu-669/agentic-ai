[project]
name = "agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "black>=26.10.1",
    "dotenv>=0.9.9",
    "ipykernel>=7.4.0",
    "isort>=9.0.2",
    "langchain>=1.5.0",
    "langchain-nvidia-ai-endpoints>=1.5.0",
    "langgraph>=1.2.22",
    "python-dotenv>=1.2.4",
]

[project.scripts]
agentic-ai = "agentic_ai:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
